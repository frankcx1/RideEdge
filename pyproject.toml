[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "farol"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["tzdata; sys_platform == 'win32'", "PyYAML>=6,<7"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "gguf>=0.19,<1", "jinja2>=3.1.6,<4"]
voice = ["faster-whisper>=1.2,<2"]
events = ["beautifulsoup4>=4.12,<5"]
dev = ["pytest>=8", "ruff>=0.9", "httpx>=0.28", "jsonschema>=4.23,<5"]

[project.scripts]
farol-sim = "farol.simulator:main"

[tool.hatch.build.targets.wheel]
packages = ["farol"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
