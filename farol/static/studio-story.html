<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideEdge · The local AI engine</title>
<style>
:root{color-scheme:dark;--bg:#09131d;--panel:#142532;--ink:#f3f1e9;--muted:#adc0cc;--accent:#ffb376;--teal:#83d4ca}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:26px/1.45 'Segoe UI',sans-serif;color:var(--ink)}button,a,select{font:inherit}button,select{background:#142532;color:var(--ink);border:1px solid #426170;border-radius:9px;padding:9px 18px;cursor:pointer}button:hover,button[aria-current=true]{border-color:var(--accent);color:var(--accent)}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:4px}a{color:var(--teal)}#viewport{position:relative;width:100%;overflow:hidden}#stage{width:1920px;height:1080px;transform-origin:top left;padding:58px 94px;position:relative;background:radial-gradient(ellipse at 90% 10%,#17333b 0,transparent 55%),var(--bg)}header{display:flex;justify-content:space-between;align-items:center;font-size:24px;letter-spacing:2px}header b{color:var(--accent)}header span:last-child{font-size:20px;color:var(--muted);letter-spacing:1px}.eyebrow{color:var(--teal);font-size:23px;letter-spacing:3px;margin:67px 0 12px}h1{font-size:72px;line-height:1.12;letter-spacing:-2px;margin:0 0 23px;max-width:1650px}h2{font-size:36px;line-height:1.2;margin:17px 0 10px}.sub{font-size:31px;color:var(--muted);margin:0;max-width:1550px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:53px}.card{background:linear-gradient(145deg,#1b3441,#10212e);border:1px solid #39515f;border-radius:22px;padding:31px 27px;min-height:260px}.card p{font-size:27px;margin:12px 0;color:var(--muted)}.symbol{color:var(--teal);font-size:25px;letter-spacing:1px}.pill{display:inline-block;color:var(--accent);font-size:21px;border:1px solid #705c45;border-radius:50px;padding:7px 15px;margin-top:22px}.flow{display:flex;align-items:center;gap:28px;margin-top:65px}.node{flex:1;border:1px solid #39515f;background:var(--panel);border-radius:22px;padding:35px 32px;min-height:210px}.node.hero{border:2px solid var(--teal);background:#18383c}.node small{font-size:23px;color:var(--muted)}.arrow{font-size:46px;color:var(--accent)}.caption{font-size:27px;color:var(--muted);margin:38px 0 0}.cycle{display:flex;align-items:center;gap:95px;margin-top:45px}.clock{width:370px;height:370px;border:3px solid var(--teal);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 80px #2b717322}.clock b{font-size:133px;font-weight:500;line-height:1}.clock span{font-size:33px;color:var(--teal)}.questions{display:grid;gap:27px;font-size:39px}.questions div{padding-left:27px;border-left:3px solid var(--accent)}.two{grid-template-columns:1fr 1fr}.two .card{min-height:246px}.value{font-size:56px;line-height:1.2;margin:25px 0 14px;color:var(--teal)}.uncertain{display:flex;align-items:center;gap:75px;margin-top:65px}.question{width:235px;height:235px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:150px}.uncertain p{font-size:39px;max-width:1150px;line-height:1.5;margin:0}.uncertain strong{color:var(--accent)}footer{position:absolute;bottom:50px;left:94px;right:94px;display:flex;justify-content:space-between;gap:50px;border-top:1px solid #2d4553;padding-top:20px;color:var(--muted);font-size:21px}#controls{padding:20px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:17px}#error{font-size:18px;color:var(--accent);padding:0 28px}body.clean #controls,body.clean #error{display:none}[hidden]{display:none!important}@media(prefers-reduced-motion:no-preference){button{transition:color .15s,border-color .15s}}
</style></head><body><div id="viewport"><main id="stage" aria-label="RideEdge presentation dashboard"><header><span><b>RIDEEDGE</b> / THE LOCAL AI ENGINE</span><span>CADENCE 3 MOMENTUM</span></header><section id="scene" aria-live="polite"></section><footer><span id="footnote">How RideEdge works</span><span id="step"></span></footer></main></div>
<div id="controls"><button id="play">Play narration cues</button><button id="restart">Restart</button><div id="chapters"></div><select id="mode" aria-label="Data source"><option value="live">Read-only server status</option><option value="captured">Recorded evaluation</option></select><button id="refresh">Refresh status</button><button id="clean">Clean frame</button><a href="/studio">Full infrastructure dashboard</a></div><p id="error" role="status"></p>
<script>
'use strict';
const cues=[{at:0,id:'feeds',name:'Data feeds'},{at:4.5,id:'model',name:'Local Qwen'},{at:7.2,id:'cycle',name:'Review again'},{at:15.3,id:'availability',name:'Feed status'},{at:18.5,id:'status',name:'Model status'},{at:23.7,id:'unknown',name:'Missing data'}];
const providers=[['ticketmaster_events','Ticketmaster','Events','Where and when'],['flightaware_sea','FlightAware','Flights','Arrival windows'],['google_places_closing','Google Places','Places','Locations & hours'],['besttime_busyness','BestTime','Venue activity','Relative to its own peak']];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let snapshot=null,current='feeds',playing=false,elapsed=0,started=0,requestId=0;
function stamp(v){if(!v)return 'Not observed';const d=new Date(v);return Number.isNaN(d.valueOf())?'Not observed':d.toLocaleString('en-US',{timeZone:'America/Los_Angeles',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' PT'}
function feedState(id){const f=snapshot?.health?.feeds?.find(f=>f.adapter===id);if(id==='besttime_busyness'&&snapshot?.besttime?.enabled===false)return 'Paid refresh paused';if(!f)return 'Not observed';return f.healthy===true?'Source healthy':'Standby / needs attention'}
function title(k,h,s){return `<p class="eyebrow">${k}</p><h1>${h}</h1><p class="sub">${s}</p>`}
function draw(id){current=id;let html='',note='How RideEdge works';
if(id==='feeds')html=title('01 / GATHER THE EVIDENCE','A city full of useful signals.','Different feeds answer different parts of the driving question.')+`<div class="cards">${providers.map(([aid,name,type,role])=>`<article class="card"><span class="symbol">${type.toUpperCase()}</span><h2>${name}</h2><p>${role}</p></article>`).join('')}</div><p class="caption">Traffic, weather and local schedules add context.</p>`;
if(id==='model')html=title('02 / EVALUATE LOCALLY','The workstation does the thinking.','The app gathers evidence. Local Qwen evaluates the options.')+`<div class="flow"><div class="node"><small>INPUT</small><h2>Collected evidence</h2></div><span class="arrow">→</span><div class="node hero"><small>ON workstation</small><h2>Local Qwen</h2></div><span class="arrow">→</span><div class="node"><small>OUTPUT</small><h2>Checked guidance</h2></div></div><p class="caption">Owned instructions guide the model. Application checks guard the result.</p>`;
if(id==='cycle')html=title('03 / KEEP REVISITING THE QUESTION','An engine that comes back for another look.','During an active planning session, the next review follows the last.')+`<div class="cycle"><div class="clock"><b>10</b><span>minutes</span></div><div class="questions"><div>What has changed?</div><div>What is coming up?</div><div>Where might it make sense to go?</div></div></div>`,note='Scheduled ten minutes after the previous evaluation finishes · not continuous inference';
if(id==='availability')html=title('04 / SEE WHAT IS AVAILABLE','Know which feeds you can rely on.','Source availability stays visible alongside its role.')+`<div class="cards">${providers.map(([aid,name,type,role])=>`<article class="card"><span class="symbol">${type.toUpperCase()}</span><h2>${name}</h2><span class="pill">${esc(feedState(aid))}</span></article>`).join('')}</div><p class="caption">A healthy source does not mean every place has a current observation.</p>`;
if(id==='status'){const m=snapshot?.runtime?.model,s=snapshot?.runtime?.scheduler,p=snapshot?.runtime?.performance?.samples?.[0];const recorded=snapshot?.mode==='captured';const state=recorded?'Review '+(snapshot?.decision?.audit?.validation||'not observed'):({ready:'Ready on workstation',loading:'Loading',different_model:'Another model loaded',unavailable:'Unavailable',reported_unverified:'Not verified'}[m?.state]||'Not observed');html=title('05 / CHECK THE ENGINE','Is the model ready? When did it last review?','Two useful checks, without an operations console to decipher.')+`<div class="cards two"><article class="card"><span class="symbol">${recorded?'RECORDED QWEN REVIEW':'LOCAL QWEN STATUS'}</span><div class="value">${esc(state)}</div><p>${recorded?'Result from the saved evaluation.':'Observed server readiness, not an active inference claim.'}</p></article><article class="card"><span class="symbol">${recorded?'RECORDED EVALUATION':'LATEST RETAINED EVIDENCE'}</span><div class="value">${esc(stamp(snapshot?.decision?.generated_at||s?.last_evidence_at))}</div><p>Model request: ${esc(stamp(p?.observed_at))}</p></article></div>`}
if(id==='unknown')html=title('06 / KEEP THE UNCERTAINTY VISIBLE','Missing data does not mean a quiet neighborhood.','The app keeps the difference clear.')+`<div class="uncertain"><div class="question">?</div><p>If current activity is unavailable,<br>it stays <strong>unknown.</strong><br>It does not become “no activity.”</p></div>`;
if(['availability','status'].includes(id))note=snapshot?`${snapshot.mode==='captured'?'Recorded evaluation':'Server observations'} · ${stamp(snapshot.observed_at)}`:'Status unavailable · no replacement measurements invented';
$('scene').innerHTML=html;$('footnote').textContent=note;$('step').textContent=String(cues.findIndex(c=>c.id===id)+1).padStart(2,'0')+' / 06';document.querySelectorAll('[data-cue]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.cue===id)));
}
function seek(t){elapsed=Math.max(0,Math.min(28.666667,t));const cue=cues.filter(c=>c.at<=elapsed).at(-1);if(cue.id!==current)draw(cue.id)}
function stop(){playing=false;$('play').textContent='Play narration cues'}
function fit(){const scale=innerWidth/1920;$('stage').style.transform=`scale(${scale})`;$('viewport').style.height=1080*scale+'px'}
async function refresh(){const id=++requestId;try{const r=await fetch('/api/studio?mode='+$('mode').value,{cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Sign in through the full dashboard first.':'Server status unavailable.');const d=await r.json();if(id!==requestId)return;snapshot=d;$('error').textContent='';draw(current)}catch(e){if(id!==requestId)return;snapshot=null;$('error').textContent=e.message;draw(current)}}
for(const c of cues){const b=document.createElement('button');b.textContent=c.name;b.dataset.cue=c.id;b.onclick=()=>{stop();elapsed=c.at;draw(c.id)};$('chapters').append(b)}
$('play').onclick=()=>{if(playing){stop();return}if(elapsed>=28.666)seek(0);playing=true;started=performance.now()-elapsed*1000;$('play').textContent='Pause'};
$('restart').onclick=()=>{stop();seek(0)};$('refresh').onclick=refresh;$('mode').onchange=refresh;$('clean').onclick=()=>document.body.classList.add('clean');
addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('clean')});addEventListener('resize',fit);
function tick(){if(playing){seek((performance.now()-started)/1000);if(elapsed>=28.666)stop()}requestAnimationFrame(tick)}
window.RideEdgeStory={seek,draw,setSnapshot:d=>{snapshot=d;draw(current)},cues};
fit();draw('feeds');requestAnimationFrame(tick);if(new URLSearchParams(location.search).has('clean'))document.body.classList.add('clean');if(location.protocol!=='file:')refresh();
</script></body></html>
